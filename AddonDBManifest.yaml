ShortDescription: Modern, performant, and fully customizable achievement tracking for you and your friends, across PC storefronts, consoles, emulators, and more
Name: Playnite Achievements
Author: Justin Delano
SourceUrl: https://github.com/justin-delano/PlayniteAchievements
IconUrl: https://raw.githubusercontent.com/justin-delano/PlayniteAchievements/main/source/icon.png
Description: Playnite Achievements is a modern, performant, and fully customizable achievement extension for Playnite. It tracks achievements for you and your friends from Steam, GOG, Epic Games Store, Battle.net, EA app, PlayStation Network, Xbox Live, RetroAchievements, RPCS3, ShadPS4, Xenia, Final Fantasy XIV, HoYoverse, and Exophase, with manual tracking for everything else. Includes achievement unlock notifications with screenshots and recordings, per-game customization (capstones, categories, notes, ordering, custom icons), flexible overview visualizations, tag sync, hotkeys, and migration for SuccessStory themes.
